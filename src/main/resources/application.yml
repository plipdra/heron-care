spring:
  application:
    name: heron-api
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/heron}
      # Pinning the database name explicitly. Atlas's default connection string
      # has no database segment ("…mongodb.net/?appName=Heron"), which would
      # land Spring on the `test` database; this property overrides that.
      database: heron
      auto-index-creation: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

heron:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  uploads:
    base-path: ${UPLOADS_BASE_PATH:/app/uploads}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
