services:
  - type: web
    name: heron-care
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_ACCESS_TTL_MIN
        value: "15"
      - key: JWT_REFRESH_TTL_DAYS
        value: "7"
      - key: CORS_ALLOWED_ORIGINS
        value: https://heron.technology-keyan.com
      - key: UPLOADS_BASE_PATH
        value: /app/uploads
      # The following are set in the Render dashboard, not synced from blueprint.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
